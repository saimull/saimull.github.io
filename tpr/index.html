<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TPR | Topic Picker Roulette</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 35%,#263044,#090c13 72%);color:#f6e7c5;font-family:system-ui,Arial;min-height:100vh;display:flex;align-items:center;justify-content:center}.wrap{text-align:center;width:min(96vw,650px);padding:20px}h1{letter-spacing:.16em;font-size:clamp(22px,5vw,38px);margin:8px}p{color:#c3b38e}.stage{position:relative;width:min(88vw,520px);aspect-ratio:1;margin:25px auto}.wheel{width:100%;height:100%;border:9px solid #d6ad5d;border-radius:50%;box-shadow:0 0 40px #a7753238,0 0 0 5px #554021;transition:transform 6.5s cubic-bezier(.12,.73,.08,1);background:#152038}.wheel svg{width:100%;height:100%;display:block}.pointer{position:absolute;top:-20px;left:50%;transform:translateX(-50%);z-index:4;width:0;height:0;border-left:19px solid transparent;border-right:19px solid transparent;border-top:40px solid #f4d182;filter:drop-shadow(0 2px 3px #000)}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:23%;aspect-ratio:1;border-radius:50%;background:#111827;border:5px solid #e4b968;display:grid;place-items:center;font-size:clamp(18px,5vw,33px);font-weight:900;letter-spacing:2px;box-shadow:0 2px 15px #0009}button{border:0;border-radius:50px;background:linear-gradient(120deg,#f9dc95,#ba8537);color:#141923;padding:16px 65px;font-size:19px;font-weight:900;cursor:pointer}button:disabled{opacity:.55}#result{min-height:55px;font-size:clamp(22px,5vw,32px);font-weight:800;margin:20px 0;color:#f4d182}.small{font-size:12px;color:#8c8d94}</style></head><body><main class="wrap"><h1>TOPIC PICKER ROULETTE</h1><p>What should we talk about next?</p><div class="stage"><div class="pointer"></div><div class="wheel" id="wheel"><svg viewBox="0 0 400 400" id="art" aria-label="Topic roulette wheel"></svg></div><div class="hub">TPR</div></div><div id="result" aria-live="polite">Ready to spin?</div><button id="spin">SPIN</button><p class="small">Sai Builds Wealth · Homebuying & Personal Finance</p></main><script>const topics=['Mortgage Payoff','Rent vs Buy','HELOC','Property Taxes','Builder Incentives','PMI','15 vs 30 Years','Refinancing','House Hacking','Home Equity','Hidden Costs','Rate Buydowns'];const svg=document.getElementById('art');const NS='http://www.w3.org/2000/svg',n=topics.length,step=360/n;function el(tag,attrs,text){let e=document.createElementNS(NS,tag);for(let k in attrs)e.setAttribute(k,attrs[k]);if(text)e.textContent=text;return e}topics.forEach((t,i)=>{let a=(-90+i*step)*Math.PI/180,b=(-90+(i+1)*step)*Math.PI/180,r=197;let d='M 200 200 L '+(200+r*Math.cos(a))+' '+(200+r*Math.sin(a))+' A '+r+' '+r+' 0 0 1 '+(200+r*Math.cos(b))+' '+(200+r*Math.sin(b))+' Z';svg.appendChild(el('path',{d,fill:i%2?'#293a52':'#15243a',stroke:'#c6a05b','stroke-width':'1.4'}));let angle=-90+(i+.5)*step,rad=angle*Math.PI/180;let readableAngle=angle>90?angle-180:angle;let g=el('g',{transform:'translate('+(200+132*Math.cos(rad))+' '+(200+132*Math.sin(rad))+') rotate('+readableAngle+')'});let lines=({'Mortgage Payoff':['Mortgage','Payoff'],'Rent vs Buy':['Rent vs','Buy'],'Property Taxes':['Property','Taxes'],'Builder Incentives':['Builder','Incentives'],'15 vs 30 Years':['15 vs 30','Years'],'House Hacking':['House','Hacking'],'Home Equity':['Home','Equity'],'Hidden Costs':['Hidden','Costs'],'Rate Buydowns':['Rate','Buydowns']})[t]||[t];lines.forEach((line,j)=>g.appendChild(el('text',{x:0,y:(j-(lines.length-1)/2)*12,'text-anchor':'middle','dominant-baseline':'middle',fill:'#fff3d4','font-size':line.length>10?10:12,'font-weight':'700'},line)));svg.appendChild(g)});let turns=0,spinning=false;document.getElementById('spin').onclick=()=>{if(spinning)return;spinning=true;let btn=document.getElementById('spin');btn.disabled=true;document.getElementById('result').textContent='Spinning…';let offset=(Math.random()-.5)*13;let target=360-(step/2)+offset;let current=((turns%360)+360)%360;let advance=((target-current+360)%360);turns+=360*(6+Math.floor(Math.random()*3))+advance;document.getElementById('wheel').style.transform='rotate('+turns+'deg)';setTimeout(()=>{spinning=false;btn.disabled=false;document.getElementById('result').textContent='MORTGAGE PAYOFF 🎯'},6650)};</script></body></html>
